<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#FCE9E9">
<title>imreallydumb</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23E0607E' d='M12 21C12 21 3 14.5 3 8.5 3 5.9 5 4 7.5 4c1.8 0 3.4 1 4.5 2.6C13.1 5 14.7 4 16.5 4 19 4 21 5.9 21 8.5 21 14.5 12 21 12 21z'/%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&amp;family=Nunito:wght@400;600;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit}
.folder-btn{display:flex;align-items:center;gap:12px;width:100%;box-sizing:border-box;min-height:56px;padding:12px 16px;border:2px solid #F4BFC9;border-radius:16px;background-color:#FFFFFF;color:#5B3A44;font-family:'Nunito',sans-serif;font-size:17px;font-weight:800;text-align:left;cursor:pointer;transition:transform .25s ease,background-color .25s ease,box-shadow .25s ease,border-color .25s ease}
.folder-btn:hover{transform:translateX(8px) rotate(-1.5deg);background-color:#FFF4B8;border-color:#F4A7B9;box-shadow:0 8px 18px rgba(138,61,85,0.18)}
.folder-btn:hover .folder-ico{animation:wiggle .6s ease}
.folder-btn.is-on{background-color:#F6D5DC;border-color:#8A3D55}
.folder-btn:focus-visible{outline:3px solid #8A3D55;outline-offset:2px}
@keyframes wiggle{0%,100%{transform:rotate(0deg) scale(1)}25%{transform:rotate(-14deg) scale(1.15)}75%{transform:rotate(14deg) scale(1.15)}}
.panel-in{animation:panelIn .5s ease both}
@keyframes panelIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.card-hover{transition:transform .3s cubic-bezier(.34,1.56,.64,1),rotate .3s ease,box-shadow .3s ease}
.card-hover:hover{transform:translateY(-10px) scale(1.06);rotate:0deg !important;box-shadow:0 16px 28px rgba(138,61,85,0.28) !important}
.card-hover:hover .play-badge{animation:pulse .9s ease infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
.flower-fly{position:fixed;left:0;pointer-events:none;z-index:50;animation:flowerPass 2.4s ease-in-out forwards}
@keyframes flowerPass{0%{transform:translate(-20vw,0) rotate(0deg)}30%{transform:translate(25vw,-8vh) rotate(110deg)}60%{transform:translate(60vw,6vh) rotate(230deg)}100%{transform:translate(120vw,-4vh) rotate(360deg)}}
.slide{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;box-sizing:border-box;width:100%;min-height:100vh;margin:0;padding:24px 20px;border:0;background-color:#FCE9E9;background-image:radial-gradient(#F4BFC9 1.5px,transparent 1.5px);background-size:26px 26px;color:#5B3A44;font-family:'Nunito',sans-serif;text-align:center;cursor:pointer;overflow:hidden}
.drop-in{animation:dropIn .9s cubic-bezier(.34,1.56,.64,1) both}
@keyframes dropIn{from{opacity:0;transform:translateY(-70px) scale(.8)}to{opacity:1;transform:none}}
.sway{animation:sway 3s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-6deg) translateY(0)}50%{transform:rotate(6deg) translateY(6px)}}
.tear{animation:tearFall 2.2s ease-in infinite}
@keyframes tearFall{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(26px);opacity:0}}
.tap-pulse{animation:tapPulse 1.8s ease-in-out infinite}
@keyframes tapPulse{0%,100%{opacity:.75;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}
.screen-pop{position:relative;animation:screenPop .9s cubic-bezier(.34,1.56,.64,1) both}
@keyframes screenPop{from{opacity:0;transform:scale(.5) rotate(-6deg)}to{opacity:1;transform:none}}
.curtain-l{transform-origin:left center;animation:curtainL 1.4s .6s ease-in-out both}
.curtain-r{transform-origin:right center;animation:curtainR 1.4s .6s ease-in-out both}
@keyframes curtainL{from{transform:scaleX(1)}to{transform:scaleX(.14)}}
@keyframes curtainR{from{transform:scaleX(1)}to{transform:scaleX(.14)}}
.fade-text{animation:fadeUp .9s 1.4s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px) scale(.9)}to{opacity:1;transform:none}}
.float-heart{position:absolute;bottom:20px;animation:floatUp 3.4s ease-in infinite}
@keyframes floatUp{0%{transform:translateY(0) scale(.6);opacity:0}20%{opacity:1}100%{transform:translateY(-130px) scale(1.1);opacity:0}}
.pan-out{position:fixed;top:0;left:0;right:0;bottom:0;z-index:40;animation:panOut .95s ease-in forwards}
@keyframes panOut{to{transform:translateX(-100%) scale(.92)}}
.pan-in{animation:panIn .95s cubic-bezier(.22,1,.36,1) both}
@keyframes panIn{from{transform:translateX(100%)}to{transform:none}}
.next-arrow{display:flex;align-items:center;justify-content:center;position:relative;margin:40px auto 0;width:min(320px,90%);height:112px;padding:0 30% 0 0;box-sizing:border-box;border:0;background:#C94B6B;color:#FFFFFF;font-family:'Caveat',cursive;font-size:48px;font-weight:700;cursor:pointer;clip-path:polygon(0 22%,70% 22%,70% 0,100% 50%,70% 100%,70% 78%,0 78%);animation:bobX 1.1s ease-in-out infinite}
.next-arrow:hover{background:#A83A57;animation-duration:.55s}
.next-arrow:focus-visible{background:#A83A57}
@keyframes bobX{0%,100%{transform:translateX(0)}50%{transform:translateX(12px)}}
.slide-in{animation:slideIn .8s cubic-bezier(.22,1,.36,1) both}
@keyframes slideIn{from{opacity:0;transform:translateY(40px) scale(.96)}to{opacity:1;transform:none}}
.wobble{animation:wobble 2.6s ease-in-out infinite}
@keyframes wobble{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
.note-btn{position:relative;display:flex;align-items:center;justify-content:center;width:190px;height:130px;border:0;font-family:'Caveat',cursive;font-size:60px;font-weight:700;color:#5B3A44;cursor:pointer;box-shadow:0 10px 22px rgba(138,61,85,0.22);transition:transform .3s cubic-bezier(.34,1.56,.64,1),scale .6s cubic-bezier(.34,1.56,.64,1),rotate .3s ease}
.note-btn::before{content:'';position:absolute;top:-12px;left:50%;margin-left:-38px;width:76px;height:24px;background:rgba(167,222,200,0.85);transform:rotate(3deg)}
.note-btn:hover{transform:scale(1.07)}
.note-btn:focus-visible{outline:3px solid #8A3D55;outline-offset:4px}
.note-yes{background:#FFF4B8;z-index:5}
.note-no{background:#F6D5DC;z-index:6}
.yes-full{position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:60;box-shadow:none;animation:fullPop .5s cubic-bezier(.34,1.56,.64,1) both}
.yes-full::before{display:none}
.yes-full:hover{transform:none}
@keyframes fullPop{from{opacity:.6;transform:scale(.9)}to{opacity:1;transform:none}}
@keyframes shakeA{0%,100%{translate:0 0}20%{translate:-14px 0}40%{translate:12px 0}60%{translate:-9px 0}80%{translate:6px 0}}
@keyframes shakeB{0%,100%{translate:0 0}20%{translate:-14px 0}40%{translate:12px 0}60%{translate:-9px 0}80%{translate:6px 0}}
.shake-a{animation:shakeA .45s ease}
.shake-b{animation:shakeB .45s ease}
.pop-text{position:fixed;left:50%;top:16%;translate:-50% 0;z-index:70;pointer-events:none;box-sizing:border-box;max-width:92vw;padding:10px 28px;background:#FFFFFF;border:4px solid #E0607E;border-radius:16px;box-shadow:0 14px 30px rgba(138,61,85,0.3);font-family:'Caveat',cursive;font-weight:700;font-size:clamp(46px,12vw,110px);line-height:1.05;color:#5B3A44;text-align:center;animation:popIn .6s cubic-bezier(.34,1.56,.64,1) both}
@keyframes popIn{from{opacity:0;transform:scale(.4) rotate(-8deg)}to{opacity:1;transform:scale(1) rotate(-3deg)}}
.no-arrow{position:absolute;left:50%;top:-104px;margin-left:-32px;pointer-events:none;animation:bobY .9s ease-in-out infinite}
@keyframes bobY{0%,100%{transform:translateY(0)}50%{transform:translateY(12px)}}
.confetti{position:fixed;top:0;left:0;right:0;bottom:0;z-index:80;pointer-events:none;overflow:hidden}
.confetti-piece{position:absolute;left:50%;top:45%;animation:confettiPop 3s ease-out both}
@keyframes confettiPop{0%{transform:translate(0,0) rotate(0deg) scale(.4);opacity:1}35%{transform:translate(var(--dx),var(--up)) rotate(260deg) scale(1);opacity:1}100%{transform:translate(calc(var(--dx) * 1.25),70vh) rotate(900deg) scale(1);opacity:.9}}
.card-hit{position:absolute;top:0;left:0;right:0;bottom:0;z-index:3;width:100%;height:100%;margin:0;padding:0;border:0;background:transparent;cursor:pointer}
.card-hit:focus-visible{outline:3px solid #8A3D55;outline-offset:3px}
.snd-btn{position:fixed;top:12px;right:12px;z-index:100;display:flex;align-items:center;justify-content:center;width:44px;height:44px;padding:0;border:2px solid #F4BFC9;border-radius:22px;background:#FFFFFF;cursor:pointer;box-shadow:0 4px 12px rgba(138,61,85,0.2);transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
.snd-btn:hover{transform:scale(1.12) rotate(-6deg)}
.snd-btn:focus-visible{outline:3px solid #8A3D55;outline-offset:2px}
.bg-heart{position:absolute;bottom:-50px;pointer-events:none;animation:bgRise 9s linear infinite}
@keyframes bgRise{0%{transform:translateY(0) rotate(0deg);opacity:0}15%{opacity:.55}100%{transform:translateY(-118vh) rotate(28deg);opacity:0}}
.box-scrim{position:absolute;top:0;left:0;right:0;bottom:0;width:100%;height:100%;margin:0;padding:0;border:0;background:rgba(91,58,68,0.58);cursor:pointer;animation:scrimIn .3s ease both}
@keyframes scrimIn{from{opacity:0}to{opacity:1}}
.box-card{position:relative;box-sizing:border-box;padding:14px 14px 18px;background:#FFFFFF;box-shadow:0 24px 50px rgba(0,0,0,0.35);animation:boxOpen .75s cubic-bezier(.34,1.56,.64,1) both}
@keyframes boxOpen{0%{opacity:0;transform:translateY(80px) scale(.2) rotate(-20deg)}60%{opacity:1;transform:translateY(-8px) scale(1.06) rotate(3deg)}100%{opacity:1;transform:translateY(0) scale(1) rotate(-2deg)}}
.box-close{position:absolute;top:-16px;right:-16px;z-index:4;display:flex;align-items:center;justify-content:center;width:44px;height:44px;padding:0;border:0;border-radius:22px;background:#C94B6B;cursor:pointer;box-shadow:0 6px 14px rgba(138,61,85,0.35);transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
.box-close:hover{transform:rotate(90deg) scale(1.1)}
.box-close:focus-visible{outline:3px solid #FFFFFF;outline-offset:2px}
.box-heart{position:absolute;left:50%;top:50%;pointer-events:none;animation:heartBurst 1.6s ease-out both}
@keyframes heartBurst{0%{transform:translate(-50%,-50%) scale(.2);opacity:0}20%{opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--up))) scale(1.2) rotate(25deg);opacity:0}}
.intro-full{height:100vh;height:100dvh}
.yes-full{height:100vh;height:100dvh}
@supports (height:100dvh){.slide{min-height:100dvh}}
@media (prefers-reduced-motion: reduce){.folder-btn{transition:none}.folder-btn:hover{transform:none}.folder-btn:hover .folder-ico{animation:none}.card-hover{transition:none}.card-hover:hover{transform:none}.card-hover:hover .play-badge{animation:none}.panel-in,.flower-fly,.drop-in,.sway,.tear,.tap-pulse,.screen-pop,.curtain-l,.curtain-r,.fade-text,.float-heart,.pan-out,.pan-in,.next-arrow,.slide-in,.wobble,.yes-full,.shake-a,.shake-b,.pop-text,.no-arrow,.confetti-piece,.box-card,.box-scrim,.box-heart,.bg-heart,.play-badge{animation-duration:.01s;animation-iteration-count:1}}
</style>

<style>html{background:#FCE9E9}body{background:#FCE9E9;-webkit-text-size-adjust:100%}</style>
</head>
<body>
<div id="app"></div>
<script type="text/x-tpl" id="tpl">

<sc-if value="{{showIntro}}" hint-placeholder-val="{{ true }}">
<button data-key="intro" class="slide intro-full" style="position: relative" aria-label="A little apology. Tap the screen to continue" onClick="{{tapIntro}}">
<span class="bg-heart" style="left: 6%; animation-delay: 0s"><svg width="46" height="46" viewBox="0 0 24 24" fill="#F4A7B9" aria-hidden="true"><path d="M12 21C12 21 3 14.5 3 8.5 3 5.9 5 4 7.5 4c1.8 0 3.4 1 4.5 2.6C13.1 5 14.7 4 16.5 4 19 4 21 5.9 21 8.5 21 14.5 12 21 12 21z"></path></svg></span>
<span class="bg-heart" style="left: 24%; animation-delay: 2.8s"><svg width="30" height="30" viewBox="0 0 24 24" fill="#E0607E" aria-hidden="true"><path d="M12 21C12 21 3 14.5 3 8.5 3 5.9 5 4 7.5 4c1.8 0 3.4 1 4.5 2.6C13.1 5 14.7 4 16.5 4 19 4 21 5.9 21 8.5 21 14.5 12 21 12 21z"></path></svg></span>
<span class="bg-heart" style="left: 45%; animation-delay: 5.2s"><svg width="56" height="56" viewBox="0 0 24 24" fill="#F4BFC9" aria-hidden="true"><path d="M12 21C12 21 3 14.5 3 8.5 3 5.9 5 4 7.5 4c1.8 0 3.4 1 4.5 2.6C13.1 5 14.7 4 16.5 4 19 4 21 5.9 21 8.5 21 14.5 12 21 12 21z"></path></svg></span>
<span class="bg-heart" style="left: 66%; animation-delay: 1.4s"><svg width="34" height="34" viewBox="0 0 24 24" fill="#E0607E" aria-hidden="true"><path d="M12 21C12 21 3 14.5 3 8.5 3 5.9 5 4 7.5 4c1.8 0 3.4 1 4.5 2.6C13.1 5 14.7 4 16.5 4 19 4 21 5.9 21 8.5 21 14.5 12 21 12 21z"></path></svg></span>
<span class="bg-heart" style="left: 84%; animation-delay: 4s"><svg width="50" height="50" viewBox="0 0 24 24" fill="#F4A7B9" aria-hidden="true"><path d="M12 21C12 21 3 14.5 3 8.5 3 5.9 5 4 7.5 4c1.8 0 3.4 1 4.5 2.6C13.1 5 14.7 4 16.5 4 19 4 21 5.9 21 8.5 21 14.5 12 21 12 21z"></path></svg></span>
<span class="bg-heart" style="left: 95%; animation-delay: 6.6s"><svg width="28" height="28" viewBox="0 0 24 24" fill="#F4BFC9" aria-hidden="true"><path d="M12 21C12 21 3 14.5 3 8.5 3 5.9 5 4 7.5 4c1.8 0 3.4 1 4.5 2.6C13.1 5 14.7 4 16.5 4 19 4 21 5.9 21 8.5 21 14.5 12 21 12 21z"></path></svg></span>
<svg class="drop-in" aria-hidden="true" viewBox="0 0 100 24" style="position: relative; display: block; width: min(94vw, 150vh); height: auto; overflow: visible; font-family: 'Caveat', cursive; font-weight: 700; animation-delay: 0.1s"><text x="1" y="19" font-size="22" fill="#5B3A44" textLength="98" lengthAdjust="spacingAndGlyphs">A LITTLE</text></svg>
<svg class="drop-in" aria-hidden="true" viewBox="0 0 100 30" style="position: relative; display: block; width: min(94vw, 150vh); height: auto; overflow: visible; font-family: 'Caveat', cursive; font-weight: 700; animation-delay: 0.5s"><text x="1" y="25" font-size="29" fill="#C94B6B" textLength="98" lengthAdjust="spacingAndGlyphs">APOLOGY</text></svg>
<span style="position: relative; display: block; width: min(60vw, 420px); height: 14px; background: rgba(244,167,185,0.8); transform: rotate(-1.5deg)"></span>
<span class="tap-pulse" style="position: relative; display: block; margin-top: 10px; font-size: 14px; font-weight: 600; letter-spacing: 0.08em; color: #8A3D55">Tap the screen</span>
</button>
</sc-if>
<sc-if value="{{showSorry}}" hint-placeholder-val="{{ true }}">
<button data-key="sorry" class="slide" aria-label="I'm really sorry. Tap the screen to continue" onClick="{{tapSorry}}">
<span class="drop-in" style="display: block">
<span class="sway" style="display: block">
<svg width="150" height="150" viewBox="0 0 100 100" aria-hidden="true">
<circle cx="50" cy="50" r="44" fill="#FFD966" stroke="#E0A93C" stroke-width="3"></circle>
<ellipse cx="25" cy="62" rx="7" ry="4.5" fill="#F4A7B9" opacity="0.7"></ellipse>
<ellipse cx="75" cy="62" rx="7" ry="4.5" fill="#F4A7B9" opacity="0.7"></ellipse>
<path d="M24 40L43 32" stroke="#8A5A1E" stroke-width="4" stroke-linecap="round" fill="none"></path>
<path d="M76 40L57 32" stroke="#8A5A1E" stroke-width="4" stroke-linecap="round" fill="none"></path>
<ellipse cx="36" cy="48" rx="5.5" ry="7" fill="#5B3A44"></ellipse>
<ellipse cx="64" cy="48" rx="5.5" ry="7" fill="#5B3A44"></ellipse>
<circle cx="38" cy="45" r="2" fill="#FFFFFF"></circle>
<circle cx="66" cy="45" r="2" fill="#FFFFFF"></circle>
<path d="M36 74Q50 61 64 74" stroke="#8A5A1E" stroke-width="4" stroke-linecap="round" fill="none"></path>
<path class="tear" d="M30 57q-5 9 0 12q5-3 0-12z" fill="#7EC8F0"></path>
</svg>
</span>
</span>
<span style="display: block; font-family: 'Caveat', cursive; font-weight: 700; font-size: clamp(64px, 17vw, 150px); line-height: 1; color: #5B3A44"><span class="drop-in" style="display: inline-block; animation-delay: 0.1s">I'M</span> <span class="drop-in" style="display: inline-block; animation-delay: 0.4s">REALLY</span> <span class="drop-in" style="display: inline-block; animation-delay: 0.7s">SORRY</span></span>
<span class="tap-pulse" style="display: block; margin-top: 8px; font-size: 14px; font-weight: 600; letter-spacing: 0.08em; color: #8A3D55">Tap the screen</span>
</button>
</sc-if>
<sc-if value="{{showMovie}}" hint-placeholder-val="{{ false }}">
<button data-key="movie" class="{{movieCls}}" aria-label="Skip to the album" onClick="{{tapMovie}}">
<span style="position: relative; display: block; width: min(340px, 84vw)">
<span class="screen-pop" style="display: block; box-sizing: border-box; padding: 14px; border-radius: 12px; background: #3A2B35; box-shadow: 0 16px 34px rgba(91,58,68,0.35)">
<span style="position: absolute; top: -12px; left: 50%; margin-left: -36px; width: 72px; height: 22px; background: rgba(250,224,150,0.9); transform: rotate(-3deg)"></span>
<span style="position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; aspect-ratio: 16 / 10; border-radius: 6px; background: #FFF4B8; padding: 12px">
<span class="fade-text" style="display: block; font-family: 'Caveat', cursive; font-size: clamp(24px, 6.6vw, 33px); line-height: 1.05; font-weight: 700; color: #5B3A44">I Made A Little Something For You</span>
<span class="curtain-l" style="position: absolute; top: 0; bottom: 0; left: 0; width: 51%; background: #F4A7B9"></span>
<span class="curtain-r" style="position: absolute; top: 0; bottom: 0; right: 0; width: 51%; background: #E88FA6"></span>
</span>
</span>
<span class="float-heart" style="left: 8%; animation-delay: 0s"><svg width="22" height="22" viewBox="0 0 24 24" fill="#E0607E" aria-hidden="true"><path d="M12 21C12 21 3 14.5 3 8.5 3 5.9 5 4 7.5 4c1.8 0 3.4 1 4.5 2.6C13.1 5 14.7 4 16.5 4 19 4 21 5.9 21 8.5 21 14.5 12 21 12 21z"></path></svg></span>
<span class="float-heart" style="left: 48%; animation-delay: 1.1s"><svg width="22" height="22" viewBox="0 0 24 24" fill="#F4A7B9" aria-hidden="true"><path d="M12 21C12 21 3 14.5 3 8.5 3 5.9 5 4 7.5 4c1.8 0 3.4 1 4.5 2.6C13.1 5 14.7 4 16.5 4 19 4 21 5.9 21 8.5 21 14.5 12 21 12 21z"></path></svg></span>
<span class="float-heart" style="left: 86%; animation-delay: 2.2s"><svg width="22" height="22" viewBox="0 0 24 24" fill="#E0607E" aria-hidden="true"><path d="M12 21C12 21 3 14.5 3 8.5 3 5.9 5 4 7.5 4c1.8 0 3.4 1 4.5 2.6C13.1 5 14.7 4 16.5 4 19 4 21 5.9 21 8.5 21 14.5 12 21 12 21z"></path></svg></span>
</span>
</button>
</sc-if>
<sc-if value="{{showMain}}" hint-placeholder-val="{{ false }}">
<div data-key="main" class="{{mainCls}}" style="overflow-x: hidden">
<div style="box-sizing: border-box; padding: 24px clamp(16px, 5vw, 64px) 48px; background-color: #FCE9E9; background-image: radial-gradient(#F4BFC9 1.5px, transparent 1.5px); background-size: 26px 26px; font-family: 'Nunito', sans-serif; color: #5B3A44">
<div style="font-family: 'Caveat', cursive; font-size: 30px; font-weight: 700; color: #8A3D55">our little album</div>
<div style="text-align: center; padding: 6px 0 4px">
<div style="font-family: 'Caveat', cursive; font-size: clamp(24px, 5vw, 30px); color: #8A3D55">a little album for</div>
<h1 style="margin: 0; font-family: 'Caveat', cursive; font-size: clamp(48px, 11vw, 80px); line-height: 1; font-weight: 700; color: #5B3A44">The Babeh</h1>
<div style="margin: 10px auto 0; width: 180px; height: 12px; background: rgba(244,167,185,0.75); transform: rotate(-1.5deg)"></div>
<p style="margin: 14px auto 0; max-width: 520px; font-size: 17px; line-height: 1.5">I'm terribly sorry for acting like such an idiot</p>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-start; max-width: 1120px; margin: 28px auto 0">
<div style="flex: 1 1 260px; max-width: 340px; min-width: 0; display: flex; flex-direction: column; gap: 12px">
<sc-for list="{{folderItems}}" as="f" hint-placeholder-count="5">
<button class="{{f.cls}}" aria-pressed="{{f.on}}" onClick="{{f.pick}}" onMouseEnter="{{f.hover}}">
<span class="folder-ico" style="display: inline-flex; width: 28px; height: 28px; flex: none">
<svg width="28" height="28" viewBox="0 0 24 24" fill="#F4BFC9" stroke="#8A3D55" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
</span>
<span style="flex: 1; min-width: 0"><span style="display: block; line-height: 1.2">{{f.name}}</span><span style="display: block; margin-top: 2px; font-size: 13px; font-weight: 600; color: #8A3D55">{{f.count}}</span></span>
</button>
</sc-for>
</div>
<div id="panel" style="flex: 999 1 420px; min-width: 0; box-sizing: border-box; min-height: 460px; background: rgba(255,255,255,0.6); border: 2px solid #F4BFC9; border-radius: 20px; padding: 24px clamp(14px, 3vw, 28px) 32px">
<sc-if value="{{show0}}" hint-placeholder-val="{{ true }}">
<div data-key="p0" class="panel-in">
<div style="text-align: center">
<h2 style="margin: 0; font-family: 'Caveat', cursive; font-size: clamp(36px, 7vw, 52px); line-height: 1; font-weight: 700; color: #5B3A44">Your Photos</h2>
</div>
<div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 34px 18px; padding-top: 30px">
<sc-for list="{{photos}}" as="p" hint-placeholder-count="11">
<div class="card-hover" style="position: relative; width: clamp(130px, 22vw, 170px); box-sizing: border-box; background: #FFFFFF; padding: 10px 10px 30px; box-shadow: 0 8px 20px rgba(138,61,85,0.16); rotate: {{p.rot}}deg">
<button class="card-hit" aria-label="{{p.label}}" onClick="{{p.open}}" onMouseEnter="{{p.hover}}"></button>
<div style="position: absolute; top: -12px; left: 50%; margin-left: -36px; width: 72px; height: 22px; background: {{p.tape}}; transform: rotate({{p.tapeRot}}deg)"></div>
<img src="{{p.src}}" alt="{{p.alt}}" style="display: block; width: 100%; aspect-ratio: {{p.ratio}}; object-fit: cover; object-position: {{p.pos}}">
</div>
</sc-for>
<div class="card-hover" style="width: min(100%, 520px); box-sizing: border-box; padding: 20px 22px; background: #FFF4B8; box-shadow: 0 8px 20px rgba(138,61,85,0.14); rotate: 2deg; font-family: 'Caveat', cursive; font-size: clamp(22px, 5vw, 26px); line-height: 1.25; color: #5B3A44">I really hope this will be enough for you to forgive me just even a little bit. I acted like such an idiot and didn't put your emotions first, and I promise it'll never happen again.<div style="margin-top: 10px; font-size: 30px; text-align: right">The other Babeh</div></div>
</div>
</div>
</sc-if>
<sc-if value="{{show1}}" hint-placeholder-val="{{ false }}">
<div data-key="p1" class="panel-in">
<div style="text-align: center">
<div style="font-family: 'Caveat', cursive; font-size: clamp(22px, 4.5vw, 28px); color: #8A3D55">my favorites</div>
<h2 style="margin: 0; font-family: 'Caveat', cursive; font-size: clamp(34px, 7vw, 52px); line-height: 1; font-weight: 700; color: #5B3A44">Your Makeups I really love</h2>
</div>
<div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 34px 18px; padding-top: 30px">
<sc-for list="{{makeups}}" as="m" hint-placeholder-count="3">
<div class="card-hover" style="position: relative; width: clamp(130px, 22vw, 170px); box-sizing: border-box; background: #FFFFFF; padding: 10px 10px 30px; box-shadow: 0 8px 20px rgba(138,61,85,0.16); rotate: {{m.rot}}deg">
<button class="card-hit" aria-label="{{m.label}}" onClick="{{m.open}}" onMouseEnter="{{m.hover}}"></button>
<div style="position: absolute; top: -12px; left: 50%; margin-left: -36px; width: 72px; height: 22px; background: {{m.tape}}; transform: rotate({{m.tapeRot}}deg)"></div>
<div style="position: relative">
<img src="{{m.src}}" alt="{{m.alt}}" style="display: block; width: 100%; aspect-ratio: {{m.ratio}}; object-fit: cover; object-position: {{m.pos}}">
<div style="position: absolute; top: 8px; right: 8px; width: 32px; height: 32px; border-radius: 16px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(138,61,85,0.2)">
<svg width="18" height="18" viewBox="0 0 24 24" fill="#E0607E" aria-hidden="true"><path d="M12 21C12 21 3 14.5 3 8.5 3 5.9 5 4 7.5 4c1.8 0 3.4 1 4.5 2.6C13.1 5 14.7 4 16.5 4 19 4 21 5.9 21 8.5 21 14.5 12 21 12 21z"></path></svg>
</div>
</div>
</div>
</sc-for>
</div>
</div>
</sc-if>
<sc-if value="{{show2}}" hint-placeholder-val="{{ false }}">
<div data-key="p2" class="panel-in">
<div style="text-align: center">
<h2 style="margin: 0; font-family: 'Caveat', cursive; font-size: clamp(40px, 8vw, 56px); line-height: 1; font-weight: 700; color: #5B3A44">US</h2>
<div style="margin-top: 6px; font-family: 'Caveat', cursive; font-size: clamp(22px, 4.5vw, 28px); color: #8A3D55">Sorry I'm terribly unphotogenic</div>
</div>
<div style="display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start; gap: 34px 18px; padding-top: 30px">
<sc-for list="{{usPics}}" as="u" hint-placeholder-count="3">
<div class="card-hover" style="position: relative; width: clamp(130px, 22vw, 170px); box-sizing: border-box; background: #FFFFFF; padding: 10px 10px 30px; box-shadow: 0 8px 20px rgba(138,61,85,0.16); rotate: {{u.rot}}deg">
<button class="card-hit" aria-label="{{u.label}}" onClick="{{u.open}}" onMouseEnter="{{u.hover}}"></button>
<div style="position: absolute; top: -12px; left: 50%; margin-left: -36px; width: 72px; height: 22px; background: {{u.tape}}; transform: rotate({{u.tapeRot}}deg)"></div>
<img src="{{u.src}}" alt="{{u.alt}}" style="display: block; width: 100%; aspect-ratio: {{u.ratio}}; object-fit: cover; object-position: {{u.pos}}">
</div>
</sc-for>
</div>
<div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 34px 24px; padding-top: 38px">
<sc-for list="{{usVids}}" as="w" hint-placeholder-count="2">
<div class="card-hover" style="position: relative; width: clamp(150px, 36vw, 210px); box-sizing: border-box; background: #FFFFFF; padding: 10px 10px 12px; box-shadow: 0 8px 20px rgba(138,61,85,0.16); rotate: {{w.rot}}deg">
<button class="card-hit" aria-label="{{w.label}}" onClick="{{w.open}}" onMouseEnter="{{w.hover}}"></button>
<div style="position: absolute; top: -12px; left: 50%; margin-left: -36px; width: 72px; height: 22px; background: {{w.tape}}; transform: rotate({{w.tapeRot}}deg)"></div>
<div style="position: relative"><img src="{{w.poster}}" alt="" style="display: block; width: 100%; aspect-ratio: {{w.ratio}}; object-fit: cover; background: #3A2B35"><div class="play-badge" style="position: absolute; left: 50%; top: 50%; margin: -24px 0 0 -24px; width: 48px; height: 48px; border-radius: 24px; background: #8A3D55; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(138,61,85,0.35)"><svg width="20" height="20" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg></div></div>
<div style="font-family: 'Caveat', cursive; font-size: clamp(18px, 4.5vw, 22px); line-height: 1.1; text-align: center; margin-top: 8px; color: #5B3A44">{{w.cap}}</div>
</div>
</sc-for>
</div>
</div>
</sc-if>
<sc-if value="{{show3}}" hint-placeholder-val="{{ false }}">
<div data-key="p3" class="panel-in">
<div style="text-align: center">
<div style="font-family: 'Caveat', cursive; font-size: clamp(22px, 4.5vw, 28px); color: #8A3D55">press play</div>
<h2 style="margin: 0; font-family: 'Caveat', cursive; font-size: clamp(34px, 7vw, 52px); line-height: 1; font-weight: 700; color: #5B3A44">Your cute makeup vids</h2>
</div>
<div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 34px 20px; padding-top: 30px">
<sc-for list="{{cuteVids}}" as="v" hint-placeholder-count="3">
<div class="card-hover" style="position: relative; width: clamp(150px, 32vw, 220px); box-sizing: border-box; background: #FFFFFF; padding: 10px 10px 12px; box-shadow: 0 8px 20px rgba(138,61,85,0.16); rotate: {{v.rot}}deg">
<button class="card-hit" aria-label="{{v.label}}" onClick="{{v.open}}" onMouseEnter="{{v.hover}}"></button>
<div style="position: absolute; top: -12px; left: 50%; margin-left: -36px; width: 72px; height: 22px; background: {{v.tape}}; transform: rotate({{v.tapeRot}}deg)"></div>
<div style="position: relative"><img src="{{v.poster}}" alt="" style="display: block; width: 100%; aspect-ratio: {{v.ratio}}; object-fit: cover; background: #3A2B35"><div class="play-badge" style="position: absolute; left: 50%; top: 50%; margin: -24px 0 0 -24px; width: 48px; height: 48px; border-radius: 24px; background: #8A3D55; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(138,61,85,0.35)"><svg width="20" height="20" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg></div></div>
<div style="font-family: 'Caveat', cursive; font-size: clamp(18px, 4.5vw, 22px); line-height: 1.1; text-align: center; margin-top: 8px; color: #5B3A44">{{v.cap}}</div>
</div>
</sc-for>
</div>
</div>
</sc-if>
<sc-if value="{{show4}}" hint-placeholder-val="{{ false }}">
<div data-key="p4" class="panel-in">
<div style="text-align: center">
<div style="font-family: 'Caveat', cursive; font-size: clamp(22px, 4.5vw, 28px); color: #8A3D55">just for you</div>
<h2 style="margin: 0; font-family: 'Caveat', cursive; font-size: clamp(36px, 7vw, 52px); line-height: 1; font-weight: 700; color: #5B3A44">Your Videos</h2>
</div>
<div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 34px 20px; padding-top: 30px">
<sc-for list="{{moreVids}}" as="x" hint-placeholder-count="3">
<div class="card-hover" style="position: relative; width: clamp(150px, 32vw, 220px); box-sizing: border-box; background: #FFFFFF; padding: 10px 10px 12px; box-shadow: 0 8px 20px rgba(138,61,85,0.16); rotate: {{x.rot}}deg">
<button class="card-hit" aria-label="{{x.label}}" onClick="{{x.open}}" onMouseEnter="{{x.hover}}"></button>
<div style="position: absolute; top: -12px; left: 50%; margin-left: -36px; width: 72px; height: 22px; background: {{x.tape}}; transform: rotate({{x.tapeRot}}deg)"></div>
<div style="position: relative"><img src="{{x.poster}}" alt="" style="display: block; width: 100%; aspect-ratio: {{x.ratio}}; object-fit: cover; background: #3A2B35"><div class="play-badge" style="position: absolute; left: 50%; top: 50%; margin: -24px 0 0 -24px; width: 48px; height: 48px; border-radius: 24px; background: #8A3D55; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(138,61,85,0.35)"><svg width="20" height="20" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg></div></div>
<div style="font-family: 'Caveat', cursive; font-size: clamp(18px, 4.5vw, 22px); line-height: 1.1; text-align: center; margin-top: 8px; color: #5B3A44">{{x.cap}}</div>
</div>
</sc-for>
</div>
<button class="next-arrow" aria-label="Next" onClick="{{goForgive}}">Next</button>
</div>
</sc-if>
</div>
</div>
<div style="text-align: center; margin-top: 36px; font-family: 'Caveat', cursive; font-size: 28px; color: #8A3D55">made with love, just because</div>
</div>
</div>
</sc-if>
<sc-if value="{{showForgive}}" hint-placeholder-val="{{ false }}">
<div data-key="forgive" class="slide-in" style="position: relative; box-sizing: border-box; min-height: 100vh; overflow: hidden; padding: 32px 20px; background-color: #FCE9E9; background-image: radial-gradient(#F4BFC9 1.5px, transparent 1.5px); background-size: 26px 26px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 36px; text-align: center; color: #5B3A44; font-family: 'Nunito', sans-serif">
<h2 class="wobble" style="margin: 0; font-family: 'Caveat', cursive; font-size: clamp(52px, 12vw, 104px); line-height: 1.02; font-weight: 700; color: #5B3A44">Can you forgive me?</h2>
<div style="display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 56px 72px">
<div style="position: relative; z-index: 5; width: 190px; height: 130px">
<button class="{{yesCls}}" onClick="{{yesTap}}" style="rotate: {{yesRot}}; scale: {{yesScale}}; font-size: {{yesFont}}">{{yesLabel}}</button>
</div>
<sc-if value="{{showNo}}" hint-placeholder-val="{{ true }}">
<div style="position: relative; z-index: 6; display: flex; flex-direction: column; align-items: center">
<sc-if value="{{showPop}}" hint-placeholder-val="{{ false }}">
<svg class="no-arrow" width="64" height="88" viewBox="0 0 64 88" aria-hidden="true"><path d="M20 0h24v46h16L32 88 4 46h16z" fill="#E0607E" stroke="#C94B6B" stroke-width="3" stroke-linejoin="round"></path></svg>
</sc-if>
<button class="{{noCls}}" onClick="{{noTap}}" style="rotate: 3deg">No</button>
<div style="margin-top: 14px; min-height: 36px; font-family: 'Caveat', cursive; font-size: 30px; color: #8A3D55">{{noMsg}}</div>
</div>
</sc-if>
</div>
<sc-if value="{{showPop}}" hint-placeholder-val="{{ false }}">
<div class="pop-text">Don't be boring</div>
</sc-if>
<sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
<div class="confetti" aria-hidden="true">
<sc-for list="{{confetti}}" as="c" hint-placeholder-count="0">
<span class="confetti-piece" style="display: block; --dx: {{c.dx}}vw; --up: {{c.up}}vh; width: {{c.w}}px; height: {{c.h}}px; background: {{c.color}}; border-radius: {{c.r}}; animation-duration: {{c.dur}}s; animation-delay: {{c.delay}}s"></span>
</sc-for>
</div>
</sc-if>
</div>
</sc-if>
<button class="snd-btn" aria-label="Toggle sound" aria-pressed="{{soundOn}}" onClick="{{toggleSound}}">
<sc-if value="{{soundOn}}" hint-placeholder-val="{{ true }}">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8A3D55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z" fill="#F4BFC9"></path><path d="M16.5 8.5a5 5 0 0 1 0 7"></path><path d="M19 6a8.5 8.5 0 0 1 0 12"></path></svg>
</sc-if>
<sc-if value="{{soundOff}}" hint-placeholder-val="{{ false }}">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8A3D55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z" fill="#F4BFC9"></path><path d="M17 9l5 6"></path><path d="M22 9l-5 6"></path></svg>
</sc-if>
</button>
<sc-if value="{{showBox}}" hint-placeholder-val="{{ false }}">
<div data-key="box" style="position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 90; display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box">
<button class="box-scrim" aria-label="Close" onClick="{{closeBox}}"></button>
<div class="box-card">
<div style="position: absolute; top: -12px; left: 50%; margin-left: -40px; width: 80px; height: 24px; background: rgba(250,224,150,0.92); transform: rotate(-3deg); z-index: 2"></div>
<button class="box-close" aria-label="Close" onClick="{{closeBox}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg></button>
<sc-if value="{{boxIsPhoto}}" hint-placeholder-val="{{ true }}">
<img src="{{boxSrc}}" alt="{{boxAlt}}" style="display: block; max-width: min(80vw, 520px); max-height: 66vh; width: auto; height: auto">
</sc-if>
<sc-if value="{{boxIsVideo}}" hint-placeholder-val="{{ false }}">
<video class="box-video" src="{{boxSrc}}" poster="{{boxPoster}}" controls playsinline style="display: block; max-width: min(78vw, 420px); max-height: 66vh; width: auto; height: auto; background: #3A2B35"></video>
<div style="margin-top: 10px; text-align: center; font-family: 'Caveat', cursive; font-size: 28px; line-height: 1.1; color: #5B3A44">{{boxCap}}</div>
</sc-if>
</div>
<sc-for list="{{boxHearts}}" as="bh" hint-placeholder-count="0">
<svg class="box-heart" style="--dx: {{bh.dx}}px; --up: {{bh.up}}px; animation-delay: {{bh.delay}}s" width="{{bh.sz}}" height="{{bh.sz}}" viewBox="0 0 24 24" aria-hidden="true"><path fill="{{bh.color}}" d="M12 21C12 21 3 14.5 3 8.5 3 5.9 5 4 7.5 4c1.8 0 3.4 1 4.5 2.6C13.1 5 14.7 4 16.5 4 19 4 21 5.9 21 8.5 21 14.5 12 21 12 21z"></path></svg>
</sc-for>
</div>
</sc-if>
<sc-for list="{{flowers}}" as="fl" hint-placeholder-count="0">
<div data-key="f{{fl.id}}" class="flower-fly" style="top: {{fl.top}}vh" aria-hidden="true">
<svg width="120" height="120" viewBox="0 0 100 100"><g fill="#F4A7B9" stroke="#E0607E" stroke-width="1.5"><ellipse cx="50" cy="26" rx="12" ry="20"></ellipse><ellipse cx="50" cy="26" rx="12" ry="20" transform="rotate(60 50 50)"></ellipse><ellipse cx="50" cy="26" rx="12" ry="20" transform="rotate(120 50 50)"></ellipse><ellipse cx="50" cy="26" rx="12" ry="20" transform="rotate(180 50 50)"></ellipse><ellipse cx="50" cy="26" rx="12" ry="20" transform="rotate(240 50 50)"></ellipse><ellipse cx="50" cy="26" rx="12" ry="20" transform="rotate(300 50 50)"></ellipse></g><circle cx="50" cy="50" r="11" fill="#FBEBB9" stroke="#E0A93C" stroke-width="2"></circle></svg>
</div>
</sc-for>
</script>
<script src="app.js"></script>
</body>
</html>
